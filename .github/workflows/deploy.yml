name: Sync Git Folder

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 'Update git folder'
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v3
      - uses: databricks/setup-cli@main

      - name: Upload mydatabrickscodes to workspace
        run: |
          for file in $(find mydatabrickscodes -type f); do
            rel_path=${file#mydatabrickscodes/}
            target="/Users/naav230@gmail.com/mydatabrickscodes/$rel_path"
            databricks workspace mkdirs "$(dirname "$target")"
            
            # Detect file extension and choose import format
            ext="${file##*.}"
            if [[ "$ext" == "py" ]]; then
              format="SOURCE"
            elif [[ "$ext" == "ipynb" ]]; then
              format="JUPYTER"
            else
              format="FILE"
            fi

            databricks workspace import "$file" "$target" --overwrite --format $format
          done

      - name: Upload mydatasource to workspace
        run: |
          for file in $(find mydatasource -type f); do
            rel_path=${file#mydatasource/}
            target="/Users/naav230@gmail.com/mydatasource/$rel_path"
            databricks workspace mkdirs "$(dirname "$target")"
            
            ext="${file##*.}"
            if [[ "$ext" == "py" ]]; then
              format="SOURCE"
            elif [[ "$ext" == "ipynb" ]]; then
              format="JUPYTER"
            else
              format="FILE"
            fi

            databricks workspace import "$file" "$target" --overwrite --format $format
          done
