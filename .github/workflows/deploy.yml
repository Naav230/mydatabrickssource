name: Sync Git Folder

concurrency: dev_environment

on:
  push:
    branches:
      # Set your base branch name here
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 'Update git folder'
    environment: dev
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v3
      - uses: databricks/setup-cli@main
      - name: Upload notebooks (preserve folders)
        run: |
          for nb in $(find notebooks -name '*.py'); do
            # Strip leading 'notebooks/' to keep relative path
            rel_path=${nb#notebooks/}
            # Remove file extension for Databricks notebook name
            base_name=$(basename "$rel_path" .py)
            # Build target path in Databricks
            target="/Users/naav230@gmail.com/sddatabricks/${rel_path%.py}"
            # Make sure parent directory exists
            databricks workspace mkdirs "$(dirname "$target")"
            # Import notebook
            databricks workspace import "$nb" "$target" --overwrite --format SOURCE
          done
