name: Sync Git Folder

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 'Update git folder'
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v3
      - uses: databricks/setup-cli@main

      - name: Upload mydatabrickscodes to workspace
        run: |
          find mydatabrickscodes -type f | while read -r file; do
            rel_path="${file#mydatabrickscodes/}"
            target="/Users/naav230@gmail.com/mydatabrickscodes/$rel_path"
            
            # Create target directory
            databricks workspace mkdirs "$(dirname "$target")"
            
            # Determine import format
            ext="${file##*.}"
            if [[ "$ext" == "py" ]]; then
              format="SOURCE"
            elif [[ "$ext" == "ipynb" ]]; then
              format="JUPYTER"
            else
              format="FILE"
            fi

            # Import file
            databricks workspace import "$file" "$target" --overwrite --format "$format"
          done

      - name: Upload mydatasource to workspace
        run: |
          find mydatasource -type f | while read -r file; do
            rel_path="${file#mydatasource/}"
            target="/Users/naav230@gmail.com/mydatasource/$rel_path"
            
            databricks workspace mkdirs "$(dirname "$target")"
            
            ext="${file##*.}"
            if [[ "$ext" == "py" ]]; then
              format="SOURCE"
            elif [[ "$ext" == "ipynb" ]]; then
              format="JUPYTER"
            else
              format="FILE"
            fi

            databricks workspace import "$file" "$target" --overwrite --format "$format"
          done
