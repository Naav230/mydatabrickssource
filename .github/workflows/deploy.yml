name: Sync Git Folder

concurrency: dev_environment

on:
  push:
    branches:
      # Set your base branch name here
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 'Update git folder'
    environment: dev
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v3
      - uses: databricks/setup-cli@main
      - name: Upload notebooks to Databricks
        run: |
          databricks workspace mkdirs /Users/naav230@gmail.com/sddatabricks
          databricks workspace import_dir ./notebooks /Users/naav230@gmail.com/sddatabricks --overwrite
