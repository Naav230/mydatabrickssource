name: Sync Git Folder

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 'Update Databricks workspace'
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Upload mydatabrickscodes folder
        run: |
          find mydatabrickscodes -type f | while read -r file; do
            rel_path="${file#mydatabrickscodes/}"
            target="/Users/naav230@gmail.com/mydatabrickscodes/$rel_path"

            # Create parent directory in Databricks workspace
            databricks workspace mkdirs "$(dirname "$target")"

            # Determine import format
            ext="${file##*.}"
            if [[ "$ext" == "py" ]]; then
              format="SOURCE"
            elif [[ "$ext" == "ipynb" ]]; then
              format="JUPYTER"
            else
              format="FILE"
            fi

            # Import file to Databricks workspace
            databricks workspace import "$file" "$target" --overwrite --format "$format"
          done

      - name: Upload mydatasource folder
        run: |
          find mydatasource -type f | w
