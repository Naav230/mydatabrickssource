name: Sync Git Folders to Databricks Community Edition

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 'Upload folders to Databricks workspace'
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Databricks CLI compatible with Community Edition
        run: |
          pip install databricks-cli==0.170.0

      - name: Upload mydatabrickscodes folder
        run: |
          find mydatabrickscodes -type f | wh
