name: Check Databricks Path

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-path:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v3
      - uses: databricks/setup-cli@main

      - name: Check if Databricks workspace path exists and run notebook
        run: |
          TARGET_PATH="/Workspace/Sonjoy"
          NOTEBOOK_PATH="/Workspace/Sonjoy/processing/products/myfirstingestionnotebook"

          echo "Checking if $TARGET_PATH exists in Databricks workspace..."

          if databricks workspace list "$(dirname "$TARGET_PATH")" | grep -q "$(basename "$TARGET_PATH")"; then
            echo "✅ Folder $TARGET_PATH exists. Running notebook..."
            databricks workspace run "$NOTEBOOK_PATH" --existing-cluster-id <your-cluster-id>
          else
            echo "❌ Folder $TARGET_PATH does NOT exist!"
            exit 1
          fi
